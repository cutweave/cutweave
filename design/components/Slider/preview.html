<!-- @dsCard group="Inputs" height=190 -->
<div class="cw-demo cw-demo--col cw-w-md">
  <div class="cw-slider">
    <span class="cw-slider__label">Opacity</span>
    <div class="cw-slider__track" role="slider" tabindex="0" aria-label="Opacity" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100" style="--value:100%">
      <span class="cw-slider__rail"><span class="cw-slider__fill"></span></span><span class="cw-slider__thumb"></span>
    </div>
    <span class="cw-slider__value cw-mono">100%</span>
    <button class="cw-kf" data-state="off" aria-pressed="false" aria-label="Add keyframe for Opacity">
      <svg class="cw-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l9 9-9 9-9-9z"/></svg>
    </button>
  </div>
  <div class="cw-slider">
    <span class="cw-slider__label">Volume</span>
    <div class="cw-slider__track" role="slider" tabindex="0" aria-label="Volume" aria-valuemin="-60" aria-valuemax="12" aria-valuenow="-6" style="--value:62%">
      <span class="cw-slider__rail"><span class="cw-slider__fill"></span></span><span class="cw-slider__thumb"></span>
    </div>
    <span class="cw-slider__value cw-mono">-6.0 dB</span>
    <button class="cw-kf" data-state="on" aria-pressed="true" aria-label="Remove keyframe at playhead for Volume">
      <svg class="cw-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l9 9-9 9-9-9z"/></svg>
    </button>
  </div>
  <div class="cw-slider">
    <span class="cw-slider__label">Blur</span>
    <div class="cw-slider__track" role="slider" tabindex="0" aria-label="Blur" aria-valuemin="0" aria-valuemax="100" aria-valuenow="24" style="--value:24%">
      <span class="cw-slider__rail"><span class="cw-slider__fill"></span></span><span class="cw-slider__thumb"></span>
    </div>
    <span class="cw-slider__value cw-mono">24 px</span>
    <button class="cw-kf" data-state="elsewhere" aria-pressed="false" aria-label="Add keyframe at playhead for Blur">
      <svg class="cw-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l9 9-9 9-9-9z"/></svg>
    </button>
  </div>
  <div class="cw-slider" aria-disabled="true">
    <span class="cw-slider__label">Feather</span>
    <div class="cw-slider__track" role="slider" aria-disabled="true" aria-label="Feather" aria-valuenow="40" style="--value:40%">
      <span class="cw-slider__rail"><span class="cw-slider__fill"></span></span><span class="cw-slider__thumb"></span>
    </div>
    <span class="cw-slider__value cw-mono">40 px</span>
    <button class="cw-kf" disabled aria-label="Keyframe unavailable">
      <svg class="cw-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l9 9-9 9-9-9z"/></svg>
    </button>
  </div>
</div>
