<!-- @dsCard group="Timeline" height=170 -->
<div class="cw-demo cw-demo--col">
  <div class="cw-timecode__bar cw-w-md">
    <button class="cw-iconbtn" aria-label="Play (Space)">
      <svg class="cw-icon" viewBox="0 0 24 24" aria-hidden="true"><polygon points="6 3 20 12 6 21 6 3"/></svg>
    </button>
    <div class="cw-timecode" role="timer" aria-label="Current time 00:01:24:17 of 00:03:10:00">
      <span class="cw-timecode__current">00:01:24:17</span>
      <span class="cw-timecode__sep">/</span>
      <span class="cw-timecode__total">00:03:10:00</span>
    </div>
    <span class="cw-chip cw-timecode__fps" title="Project frame rate">23.976</span>
  </div>
  <div class="cw-demo" style="padding:0">
    <div class="cw-timecode cw-timecode--sm">
      <span class="cw-timecode__current">00:00:12:05</span>
      <span class="cw-timecode__sep">/</span>
      <span class="cw-timecode__total">00:00:58:00</span>
    </div>
    <span class="cw-chip cw-timecode__fps">30</span>
    <div class="cw-timecode cw-timecode--sm" aria-disabled="true">
      <span class="cw-timecode__current">00:00:00:00</span>
      <span class="cw-timecode__sep">/</span>
      <span class="cw-timecode__total">00:00:00:00</span>
    </div>
  </div>
  <span class="cw-demo__cap">Transport (timecode-lg), compact (timecode), empty project (disabled)</span>
</div>
