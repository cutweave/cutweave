<!-- @dsCard group="Timeline" height=260 -->
<div class="cw-demo cw-demo--col" style="padding:0">
  <div class="cw-track cw-w-sm" data-main="true" style="--clip-color:var(--clip-media)">
    <svg class="cw-icon cw-track__icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 3v18M17 3v18M3 8h4M3 16h4M17 8h4M17 16h4"/></svg>
    <span class="cw-track__name">V1 Main</span>
    <span class="cw-track__main" title="Main track: clips ripple to close gaps">
      <svg class="cw-icon cw-icon--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 15-4-4 6.75-6.77a7.79 7.79 0 0 1 11 11L13 22l-4-4 6.39-6.36a2.14 2.14 0 0 0-3-3L6 15"/></svg>Magnetic</span>
    <div class="cw-track__toggles">
      <button class="cw-iconbtn cw-iconbtn--sm" aria-label="Lock track V1" aria-pressed="false"><svg class="cw-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></button>
      <button class="cw-iconbtn cw-iconbtn--sm" aria-label="Hide track V1" aria-pressed="false"><svg class="cw-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
    </div>
  </div>
  <div class="cw-track cw-w-sm" style="--clip-color:var(--clip-audio)">
    <svg class="cw-icon cw-track__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>
    <span class="cw-track__name">A1 Dialogue</span>
    <div class="cw-track__toggles">
      <button class="cw-iconbtn cw-iconbtn--sm" aria-label="Lock track A1" aria-pressed="true"><svg class="cw-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></button>
      <button class="cw-iconbtn cw-iconbtn--sm" aria-label="Mute track A1" aria-pressed="true"><svg class="cw-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="m22 9-6 6M16 9l6 6"/></svg></button>
      <button class="cw-iconbtn cw-iconbtn--sm cw-track__solo" aria-label="Solo track A1" aria-pressed="false">S</button>
    </div>
  </div>
  <div class="cw-track cw-w-sm" style="--clip-color:var(--clip-captions)">
    <svg class="cw-icon cw-track__icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 15h4M15 15h2M7 11h2M13 11h4"/></svg>
    <span class="cw-track__name">C1 Captions</span>
    <div class="cw-track__toggles">
      <button class="cw-iconbtn cw-iconbtn--sm" aria-label="Lock track C1" aria-pressed="false"><svg class="cw-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></button>
      <button class="cw-iconbtn cw-iconbtn--sm" aria-label="Hide track C1" aria-pressed="true"><svg class="cw-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
    </div>
  </div>
</div>
