<!-- @dsCard group="Feedback" height=230 -->
<div class="cw-demo" style="padding:0">
  <div class="cw-w-lg" role="list" aria-label="Background jobs">
    <div class="cw-job" role="listitem" data-state="running">
      <div class="cw-job__main">
        <span class="cw-job__name">Exporting Shorts_final.mp4</span>
        <div class="cw-bar" role="progressbar" aria-valuenow="64" aria-valuemin="0" aria-valuemax="100" aria-label="Exporting Shorts_final.mp4" style="--value:64%"><div class="cw-bar__fill"></div></div>
      </div>
      <span class="cw-job__pct cw-mono">64%</span>
      <span class="cw-job__eta">20 s left</span>
      <button class="cw-iconbtn cw-iconbtn--sm" aria-label="Cancel export"><svg class="cw-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="cw-job" role="listitem" data-state="running">
      <div class="cw-job__main">
        <span class="cw-job__name">Generating kling_sunrise_v2.mp4 (Kling 3.0 via fal)</span>
        <div class="cw-bar" role="progressbar" aria-valuenow="18" aria-valuemin="0" aria-valuemax="100" aria-label="Generating kling_sunrise_v2.mp4" style="--value:18%"><div class="cw-bar__fill"></div></div>
      </div>
      <span class="cw-job__pct cw-mono">18%</span>
      <span class="cw-job__eta">about 1 min</span>
      <button class="cw-iconbtn cw-iconbtn--sm" aria-label="Cancel generation"><svg class="cw-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="cw-job" role="listitem" data-state="queued">
      <div class="cw-job__main">
        <span class="cw-job__name">Transcribing interview_A.mov</span>
        <span class="cw-status" data-tone="neutral" style="align-self:flex-start"><svg class="cw-icon cw-icon--sm" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>Queued</span>
      </div>
      <span class="cw-job__pct cw-mono">0%</span>
      <span class="cw-job__eta">Waiting</span>
      <button class="cw-iconbtn cw-iconbtn--sm" aria-label="Cancel transcription"><svg class="cw-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="cw-job" role="listitem" data-state="failed">
      <div class="cw-job__main">
        <span class="cw-job__name">Rendering proxy for drone_03.mov</span>
        <div class="cw-bar" style="--value:42%"><div class="cw-bar__fill"></div></div>
        <span class="cw-job__err"><svg class="cw-icon cw-icon--sm" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>Failed: source file not found</span>
      </div>
      <span class="cw-job__pct cw-mono">42%</span>
      <button class="cw-btn cw-btn--sm">Retry</button>
    </div>
  </div>
</div>
