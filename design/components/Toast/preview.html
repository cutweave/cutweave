<!-- @dsCard group="Feedback" height=360 -->
<div class="cw-demo cw-demo--col cw-demo--on-2" style="background:var(--surface-0)">
  <div class="cw-toast cw-w-md" data-tone="success" role="status">
    <svg class="cw-icon cw-toast__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
    <div class="cw-toast__main">
      <span class="cw-toast__title">Export complete</span>
      <span class="cw-toast__text">Exported 00:00:58 to Shorts_final.mp4</span>
      <div class="cw-toast__actions"><button class="cw-btn cw-btn--sm">Show in folder</button></div>
    </div>
    <button class="cw-iconbtn cw-iconbtn--sm" aria-label="Dismiss"><svg class="cw-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  </div>
  <div class="cw-toast cw-w-md" data-tone="warning" role="status">
    <svg class="cw-icon cw-toast__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>
    <div class="cw-toast__main">
      <span class="cw-toast__title">Media missing</span>
      <span class="cw-toast__text">drone_03.mov is offline; 2 clips are unlinked.</span>
    </div>
    <button class="cw-iconbtn cw-iconbtn--sm" aria-label="Dismiss"><svg class="cw-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  </div>
  <div class="cw-toast cw-w-md" data-tone="danger" role="alert">
    <svg class="cw-icon cw-toast__icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
    <div class="cw-toast__main">
      <span class="cw-toast__title">Generation failed</span>
      <span class="cw-toast__text">Kling 3.0 via fal returned a timeout. No cost was charged.</span>
      <div class="cw-toast__actions"><button class="cw-btn cw-btn--sm">Retry</button><button class="cw-btn cw-btn--sm cw-btn--ghost">View log</button></div>
    </div>
    <button class="cw-iconbtn cw-iconbtn--sm" aria-label="Dismiss"><svg class="cw-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  </div>
  <div class="cw-toast cw-w-md" data-tone="job" role="status">
    <svg class="cw-icon cw-toast__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>
    <div class="cw-toast__main">
      <span class="cw-toast__title">Exporting Shorts_final.mp4</span>
      <div class="cw-bar" role="progressbar" aria-valuenow="64" aria-valuemin="0" aria-valuemax="100" style="--value:64%"><div class="cw-bar__fill"></div></div>
      <span class="cw-toast__text"><span class="cw-mono">64%</span> &middot; about 20 s left</span>
    </div>
    <button class="cw-iconbtn cw-iconbtn--sm" aria-label="Cancel export"><svg class="cw-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  </div>
</div>
