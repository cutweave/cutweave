<div class="cw-demo cw-demo--col cw-w-md">
  <div class="cw-search">
    <svg class="cw-icon cw-search__icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input class="cw-field cw-search__input body" type="search" aria-label="Search media" placeholder="Search media">
  </div>
  <div class="cw-search cw-search--active cw-search--counted">
    <svg class="cw-icon cw-search__icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input class="cw-field cw-search__input body" type="search" aria-label="Search media" value="beach">
    <span class="cw-search__count caption">12 of 340</span>
    <button class="cw-iconbtn cw-iconbtn--sm cw-search__clear" aria-label="Clear search"><svg class="cw-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  </div>
  <div style="display:flex;gap:var(--space-2);align-items:center">
    <span class="cw-chip"><span class="label">Audio</span><button class="cw-chip__remove" aria-label="Remove filter Audio"><svg class="cw-icon cw-icon--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button></span>
    <span class="cw-chip"><span class="label">Not used</span><button class="cw-chip__remove" aria-label="Remove filter Not used"><svg class="cw-icon cw-icon--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button></span>
    <button class="cw-btn cw-btn--ghost">Clear all</button>
    <button class="cw-iconbtn cw-iconbtn--sm" aria-label="Filters, 2 active"><svg class="cw-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 4h-7M10 4H3M21 12h-9M8 12H3M21 20h-5M12 20H3M14 2v4M8 10v4M16 18v4"/></svg><span class="cw-iconbtn__badge caption" aria-hidden="true">2</span></button>
  </div>
</div>
