<!-- @dsCard group="Inputs" height=150 -->
<div class="cw-demo cw-demo--col">
  <div class="cw-demo" style="padding:0">
    <button class="cw-kf" data-state="off" aria-pressed="false" aria-label="Add keyframe">
      <svg class="cw-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l9 9-9 9-9-9z"/></svg>
    </button>
    <button class="cw-kf" data-state="on" aria-pressed="true" aria-label="Remove keyframe at playhead">
      <svg class="cw-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l9 9-9 9-9-9z"/></svg>
    </button>
    <button class="cw-kf" data-state="elsewhere" aria-pressed="false" aria-label="Add keyframe at playhead">
      <svg class="cw-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l9 9-9 9-9-9z"/></svg>
    </button>
    <button class="cw-kf" disabled aria-label="Keyframes unavailable">
      <svg class="cw-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l9 9-9 9-9-9z"/></svg>
    </button>
    <span class="cw-demo__cap">off / on at playhead / keyframes elsewhere / disabled</span>
  </div>
  <div class="cw-demo" style="padding:0">
    <span class="cw-label">Position X</span>
    <div class="cw-kfgroup" role="group" aria-label="Keyframes for Position X">
      <button class="cw-iconbtn cw-iconbtn--sm" aria-label="Previous keyframe (Alt+Left)">
        <svg class="cw-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <button class="cw-kf" data-state="on" aria-pressed="true" aria-label="Remove keyframe at playhead">
        <svg class="cw-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l9 9-9 9-9-9z"/></svg>
      </button>
      <button class="cw-iconbtn cw-iconbtn--sm" aria-label="Next keyframe (Alt+Right)">
        <svg class="cw-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
      </button>
    </div>
    <span class="cw-mono">00:00:12:05</span>
  </div>
</div>
