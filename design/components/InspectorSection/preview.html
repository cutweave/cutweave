<!-- @dsCard group="Structure" height=330 -->
<div class="cw-demo cw-demo--col cw-w-md">
  <section class="cw-section">
    <div class="cw-section__head">
      <button class="cw-section__toggle" aria-expanded="true">
        <svg class="cw-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>Transform</button>
      <button class="cw-iconbtn cw-iconbtn--sm" aria-label="Reset Transform to default">
        <svg class="cw-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/></svg>
      </button>
    </div>
    <div class="cw-section__body">
      <div class="cw-row" data-modified="true">
        <span class="cw-row__label">Scale</span>
        <span style="display:inline-flex;align-items:center;gap:var(--space-1)">
          <div class="cw-num" role="spinbutton" tabindex="0" aria-label="Scale"><span class="cw-num__value">112</span><span class="cw-num__unit">%</span></div>
          <button class="cw-iconbtn cw-iconbtn--sm cw-row__reset" aria-label="Reset Scale">
            <svg class="cw-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/></svg>
          </button>
        </span>
      </div>
      <div class="cw-row" data-modified="false">
        <span class="cw-row__label">Rotation</span>
        <span style="display:inline-flex;align-items:center;gap:var(--space-1)">
          <div class="cw-num" role="spinbutton" tabindex="0" aria-label="Rotation"><span class="cw-num__value">0</span><span class="cw-num__unit">deg</span></div>
          <button class="cw-iconbtn cw-iconbtn--sm cw-row__reset" aria-label="Reset Rotation" tabindex="-1">
            <svg class="cw-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/></svg>
          </button>
        </span>
      </div>
      <div class="cw-row" data-modified="false">
        <span class="cw-row__label">Opacity</span>
        <span class="cw-mono">100%</span>
      </div>
    </div>
  </section>
  <section class="cw-section">
    <div class="cw-section__head">
      <button class="cw-section__toggle" aria-expanded="false">
        <svg class="cw-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>Crop</button>
    </div>
    <div class="cw-section__body"><div class="cw-row"><span class="cw-row__label">Hidden while collapsed</span></div></div>
  </section>
  <section class="cw-section">
    <div class="cw-section__head">
      <button class="cw-section__toggle" aria-expanded="false">
        <svg class="cw-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>Keyframes</button>
    </div>
  </section>
</div>
