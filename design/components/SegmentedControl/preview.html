<!-- @dsCard group="Actions" height=130 -->
<div class="cw-demo cw-demo--col">
  <div class="cw-demo" style="padding:0">
    <span class="cw-label">Aspect ratio</span>
    <div class="cw-seg" role="radiogroup" aria-label="Aspect ratio">
      <button class="cw-seg__item" role="radio" aria-checked="false">16:9</button>
      <button class="cw-seg__item" role="radio" aria-checked="true">9:16</button>
      <button class="cw-seg__item" role="radio" aria-checked="false">1:1</button>
      <button class="cw-seg__item" role="radio" aria-checked="false">4:5</button>
    </div>
  </div>
  <div class="cw-demo" style="padding:0">
    <span class="cw-label">Resize mode</span>
    <div class="cw-seg" role="radiogroup" aria-label="Resize mode">
      <button class="cw-seg__item" role="radio" aria-checked="true">Fit</button>
      <button class="cw-seg__item" role="radio" aria-checked="false">Fill</button>
      <button class="cw-seg__item" role="radio" aria-checked="false" disabled>Smart crop</button>
    </div>
  </div>
</div>
