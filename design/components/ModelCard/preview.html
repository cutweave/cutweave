<!-- @dsCard group="AI & agents" height=240 -->
<div class="cw-demo cw-demo--on-2" style="align-items:flex-start">
  <article class="cw-model cw-w-sm" aria-label="Kling 3.0">
    <div class="cw-model__head">
      <h3 class="cw-model__name">Kling 3.0</h3>
      <span class="cw-model__provider">via fal</span>
    </div>
    <div class="cw-model__caps">
      <span class="cw-chip cw-chip--cap">Image&rarr;Video</span>
      <span class="cw-chip cw-chip--cap">5&ndash;10 s</span>
      <span class="cw-chip cw-chip--cap">1080p</span>
    </div>
    <div class="cw-model__foot">
      <span class="cw-cost"><span class="cw-mono">~$0.40</span></span>
      <button class="cw-btn cw-btn--primary cw-btn--lg">
        <svg class="cw-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/></svg>Generate</button>
    </div>
  </article>
  <article class="cw-model cw-w-sm" data-state="deprecated" aria-label="Kling 2.1, deprecated">
    <div class="cw-model__head">
      <h3 class="cw-model__name">Kling 2.1</h3>
      <span class="cw-model__provider">via fal</span>
    </div>
    <div class="cw-model__caps">
      <span class="cw-chip cw-chip--cap">Image&rarr;Video</span>
      <span class="cw-chip cw-chip--cap">5 s</span>
      <span class="cw-chip cw-chip--cap">720p</span>
    </div>
    <p class="cw-model__note">
      <svg class="cw-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>
      Deprecated, replaced by Kling 3.0</p>
    <div class="cw-model__foot">
      <span class="cw-cost"><span class="cw-mono">~$0.25</span></span>
      <span style="display:inline-flex;gap:var(--space-2)">
        <button class="cw-btn cw-btn--lg">Switch to 3.0</button>
        <button class="cw-btn cw-btn--lg" disabled>Generate</button>
      </span>
    </div>
  </article>
</div>
