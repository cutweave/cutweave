<!-- @dsCard group="Actions" height=150 -->
<div class="cw-demo cw-demo--col">
  <div class="cw-toolbar" role="toolbar" aria-label="Timeline tools">
    <button class="cw-iconbtn" aria-label="Select (V)" aria-pressed="true">
      <svg class="cw-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m4 4 7 17 2.5-7.5L21 11z"/></svg>
    </button>
    <button class="cw-iconbtn" aria-label="Razor split (B)" aria-pressed="false">
      <svg class="cw-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4 8.12 15.88M14.47 14.48 20 20M8.12 8.12 12 12"/></svg>
    </button>
    <button class="cw-iconbtn" aria-label="Ripple edit (R)" aria-pressed="false">
      <svg class="cw-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h6M14 12h6M10 7v10M14 7v10"/></svg>
    </button>
    <span class="cw-toolbar__sep"></span>
    <button class="cw-iconbtn" aria-label="Snapping (N)" aria-pressed="true">
      <svg class="cw-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 15-4-4 6.75-6.77a7.79 7.79 0 0 1 11 11L13 22l-4-4 6.39-6.36a2.14 2.14 0 0 0-3-3L6 15"/><path d="m5 8 4 4"/><path d="m12 15 4 4"/></svg>
    </button>
    <button class="cw-iconbtn" aria-label="Ask agent" disabled>
      <svg class="cw-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/></svg>
    </button>
  </div>
  <div class="cw-demo" style="padding:0">
    <span class="cw-demo__cap">Small (24px)</span>
    <button class="cw-iconbtn cw-iconbtn--sm" aria-label="Lock track">
      <svg class="cw-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
    </button>
    <button class="cw-iconbtn cw-iconbtn--sm" aria-label="Hide track" aria-pressed="true">
      <svg class="cw-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
    <button class="cw-iconbtn cw-iconbtn--sm" aria-label="Close panel">
      <svg class="cw-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>
</div>
