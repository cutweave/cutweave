<div class="cw-demo cw-demo--col">
  <section class="cw-panel cw-w-md" aria-label="Inspector">
    <header class="cw-panel__header">
      <h3 class="cw-panel__title">Inspector</h3>
      <div class="cw-tabs" role="tablist">
        <button class="cw-tabs__tab" role="tab" aria-selected="true">Video</button>
        <button class="cw-tabs__tab" role="tab" aria-selected="false">Audio</button>
        <button class="cw-tabs__tab" role="tab" aria-selected="false">Speed</button>
      </div>
      <div class="cw-panel__actions">
        <button class="cw-iconbtn cw-iconbtn--sm" aria-label="Search properties">
          <svg class="cw-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        </button>
        <button class="cw-iconbtn cw-iconbtn--sm" aria-label="Close panel">
          <svg class="cw-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
    </header>
    <div class="cw-panel__body">
      <div class="cw-row"><span class="cw-row__label">Clip</span><span class="cw-mono">interview_A.mov</span></div>
      <div class="cw-panel__divider" style="margin:var(--space-2) 0"></div>
      <div class="cw-row"><span class="cw-row__label">Duration</span><span class="cw-mono">00:00:12:05</span></div>
      <div class="cw-row"><span class="cw-row__label">Frame rate</span><span class="cw-mono">23.976 fps</span></div>
    </div>
  </section>
  <section class="cw-panel cw-w-md" aria-label="Media bin">
    <header class="cw-panel__header">
      <h3 class="cw-panel__title">Media bin</h3>
      <div class="cw-panel__actions">
        <button class="cw-iconbtn cw-iconbtn--sm" aria-label="Import media">
          <svg class="cw-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
    </header>
  </section>
</div>
