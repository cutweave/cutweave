<!-- @dsCard group="Inputs" height=170 -->
<div class="cw-demo cw-demo--col cw-w-sm">
  <div class="cw-row">
    <span class="cw-row__label">Auto-ripple on delete</span>
    <button class="cw-switch" role="switch" aria-checked="false" aria-label="Auto-ripple on delete"><span class="cw-switch__thumb"></span></button>
  </div>
  <div class="cw-row">
    <span class="cw-row__label">Snap to clips</span>
    <button class="cw-switch" role="switch" aria-checked="true" aria-label="Snap to clips"><span class="cw-switch__thumb"></span></button>
  </div>
  <div class="cw-row">
    <span class="cw-row__label">Burn in captions</span>
    <button class="cw-switch" role="switch" aria-checked="true" aria-label="Burn in captions" disabled><span class="cw-switch__thumb"></span></button>
  </div>
  <div class="cw-row">
    <span class="cw-row__label">Upload to cloud render (off)</span>
    <button class="cw-switch" role="switch" aria-checked="false" aria-label="Upload to cloud render" disabled><span class="cw-switch__thumb"></span></button>
  </div>
</div>
