[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
# Phase 0 throwaway prototypes; never part of the workspace (see spikes/README.md).
exclude = ["spikes"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/cutweave/cutweave"
rust-version = "1.100"

# Skeleton: shared dependency versions are declared here and inherited with `workspace = true`.
# Every addition needs a justification in the PR and must pass cargo-deny (AGENTS.md).
[workspace.dependencies]
# Media I/O, used only behind the non-default `ffmpeg` feature of cutweave-media (ADR-0003). Pinned
# exactly: Spike S3 validated 9.1.0 (ffmpeg-sys-next 9.1.1) against FFmpeg 8.1.3. WTFPL (deny.toml).
# Default features off: cutweave-media enables only the libraries it links.
ffmpeg-next = { version = "=9.1.0", default-features = false }
# Used by xtask to read `cargo metadata` output (dependency-rule checker).
# preserve_order everywhere: one map ordering in every build, so serialized JSON (schemas, project docs,
# parity/golden comparisons) never depends on which crates happen to be compiled together.
serde_json = { version = "1", features = ["preserve_order"] }
# xtask: corpus + benchmark manifests (TOML), result JSON, and sha256 verification of fetched media.
serde = { version = "1", features = ["derive"] }
toml = "0.9"
sha2 = "0.10"
# xtask gen --check: unified diff of regenerated vs committed schema files (WP-1N.01). Already in the
# lockfile through insta (same Apache-2.0 license); now also a normal dependency of xtask.
similar = "2.7"

# cutweave-model (WP-1A): the project document and its wire contract (arch §4, ADR-0004/0005/0015).
# Persistent collections with O(1) structural-sharing snapshots for the doc actor (ADR-0005).
imbl = { version = "7.0.2", features = ["serde"] }
# JSON Schema for every wire type (MCP inputSchema/outputSchema, schema/ catalogs; arch §5.3).
schemars = "1.2.3"
# TS type export (packages/protocol, arch §5.3). Release candidates: pinned exactly (S5 findings).
specta = { version = "=2.0.0-rc.28", features = ["derive", "serde_json"] }
specta-typescript = "=0.0.15"
specta-serde = "=0.0.15"
# Typed library errors (AGENTS.md: thiserror in libraries).
thiserror = "2"
# JSON-path context for document load errors ("sequences.seq_….tracks…: missing field").
serde_path_to_error = "0.1.20"
# cutweave-media / cutweave-cache (WP-1D.02, arch §7).
# Content hash for relinking (BLAKE3: fast hash over head + tail + size, optional full hash) and
# the frame-index blob checksum. CC0-1.0 OR Apache-2.0; no network, no runtime dependencies beyond
# its own SIMD code (default features; `rayon` stays off).
blake3 = "1.8.7"
# `cache.sqlite` (frame index now; thumbnails, waveforms and LRU accounting later). `bundled`
# compiles SQLite into the binary so every platform ships the same, known version and needs no
# system library. MIT (SQLite itself is public domain).
rusqlite = { version = "0.43", features = ["bundled"] }

# Time-ordered UUIDv7 ids (native only: wasm32-unknown-unknown has no OS entropy or wall clock).
uuid = { version = "1.29", default-features = false, features = ["std", "v7"] }
# Property tests (dev and the `cutweave-model/testing` feature only).
proptest = "1.12"
# Snapshot tests of generated TS, JSON Schemas and migrated documents (dev only).
insta = { version = "1.49", features = ["json"] }

# cutweave-commands-derive (WP-1B.02): the `#[command]` / `#[query]` / `#[wire]` proc-macros.
# syn 3 is the major version serde_derive, schemars_derive and thiserror already pull in.
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "3.0.10", features = ["full"] }
# Compile-fail tests of the command macros' diagnostics (dev only).
trybuild = "1.0.125"

# cutweave-commands doc actor (WP-1B.03, arch §5.2, ADR-0005).
# Lock-free publication of immutable document snapshots: readers (render, audio, queries) never block.
arc-swap = "1.9.5"
# Structured logs (AGENTS.md: `tracing` for logs). `std` only: no proc-macro attributes.
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
# Model checking of the doc actor's submit/publish/reply protocol; only under `--cfg cutweave_loom`.
loom = { version = "0.7.3", features = ["futures"] }
# Micro-benchmarks (dev only): doc actor round trip, recorded against the arch §19 command RTT budget.
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[workspace.lints.rust]
# Allowed (with justification) only in cutweave-bridge, cutweave-playback, cutweave-audio and
# cutweave-media (its FFmpeg FFI module only, ADR-0003).
unsafe_code = "deny"
missing_docs = "warn"
# `cutweave_loom`: loom model tests (`RUSTFLAGS="--cfg cutweave_loom" cargo test -p cutweave-commands --test doc_loom`).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(cutweave_loom)"] }

[workspace.lints.clippy]
# A pedantic subset; add more as the codebase grows.
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
module_name_repetitions = "allow"
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

# Pixel loops are ~20x slower at opt-level 0, so hot crates are optimized even in dev builds.
# Command-bus hot path (WP-1B.03 measured Tx commit 490 µs → 42 µs at opt-level 2 in dev builds).
[profile.dev.package.cutweave-commands]
opt-level = 2

[profile.dev.package.cutweave-model]
opt-level = 2

[profile.dev.package.imbl]
opt-level = 2

[profile.dev.package.serde_json]
opt-level = 2

[profile.dev.package.cutweave-render]
opt-level = 3
[profile.dev.package.cutweave-text]
opt-level = 3
[profile.dev.package.cutweave-media]
opt-level = 3
[profile.dev.package.cutweave-audio]
opt-level = 3
[profile.dev.package.cutweave-cache]
opt-level = 3
# Audio DSP used by cutweave-audio (WP-1G.01): resampling at opt-level 0 makes the real-time
# tests and the soak measure debug overhead instead of the mixer.
[profile.dev.package.rubato]
opt-level = 3
[profile.dev.package.realfft]
opt-level = 3
[profile.dev.package.rustfft]
opt-level = 3
