# --- Hardware acceleration (headers / dispatchers; drivers are loaded at runtime) -----------

# SDK 12.2 headers: NVENC/NVDEC need driver >= 551.76 (Windows) / 550.54.14 (Linux). The 13.x
# headers would raise that floor to the 570 drivers; revisit when ADR-0014 settles the floor.
[deps.nvcodec]
version = "12.2.72.0"
git = "https://github.com/FFmpeg/nv-codec-headers.git"
tag = "n12.2.72.0"
commit = "c69278340ab1d5559c7d7bf0edf615dc33ddbba7"
license = "MIT"
os = ["windows", "linux"]

[deps.amf]
version = "1.5.3 (headers)"
url = "https://github.com/GPUOpen-LibrariesAndSDKs/AMF/releases/download/v1.5.3/AMF-headers-v1.5.3.tar.gz"
sha256 = "0f521ad98041f8001147cded4a660127f18b1c27a801a5cd691bda1fa48381be"
license = "MIT"
os = ["windows"]
strip = 0

# Intel oneVPL dispatcher for QSV (loads the Intel runtime at runtime).
[deps.libvpl]
version = "2.17.0"
git = "https://github.com/intel/libvpl.git"
tag = "v2.17.0"
commit = "d77f9195cf495b937631607333288fd917ae8939"
license = "MIT"
os = ["windows", "linux"]

# macOS and Linux use the system zlib; Windows has none, so it is built and linked statically.
[deps.zlib]
version = "1.3.2"
git = "https://github.com/madler/zlib.git"
tag = "v1.3.2"
commit = "da607da739fa6047df13e66a2af6b8bec7c2a498"
license = "Zlib"
os = ["windows"]

# --- Build tools that need an exact version ---------------------------------------------------

[tools]
# Ubuntu 22.04's packaged meson (0.61) is older than some pinned projects expect; the Linux
# container installs this version with pip. macOS (Homebrew) and Windows (MSYS2) use theirs.
meson_pip = "1.12.1"

# --- System libraries the Linux bundle links dynamically (Ubuntu 22.04 packages) -------------
# Driver and desktop interfaces that must come from the user's system, not from the bundle.
[system.linux]
apt = ["libva-dev", "libvdpau-dev", "libdrm-dev", "libx11-dev", "libfontconfig-dev", "zlib1g-dev"]
