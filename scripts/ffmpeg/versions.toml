# SPDX-License-Identifier: GPL-3.0-or-later
#
# Pinned inputs of the Cutweave FFmpeg shared bundle (WP-0A.06, docs/01-architecture.md §21).
#
# This file is the single source of truth for every source that goes into the bundle:
# `.github/workflows/ffmpeg.yml` and `scripts/ffmpeg/*` read it (through `sources.py`), and every
# bundle carries a copy plus the matching `SOURCES.txt`. Editing it re-runs the workflow.
#
# Rules (checked by `python3 scripts/ffmpeg/sources.py check`):
#   - a tarball source is pinned by `url` + `sha256` (optional `mirrors`, all hash-verified);
#   - a git source is pinned by `tag` or `branch` *and* the full 40-hex `commit`; the fetcher
#     fails if the tag no longer points at the commit or the commit left the branch;
#   - `os` lists the bundles that use the component (windows, macos, linux);
#   - `strip` is the number of leading path components removed when extracting (default 1).
#
# Updating a pin: change the version, then the hash/commit (the tarball sha256 can be taken from
# the upstream release page or computed after downloading), run `sources.py check`, and let the
# workflow build all three bundles. Build tools (compilers, cmake, nasm, ...) are not pinned
# here; their exact versions are recorded in each bundle's BUILD_INFO.txt.

schema = 1

[ffmpeg]
version = "8.1.3"
url = "https://ffmpeg.org/releases/ffmpeg-8.1.3.tar.xz"
sha256 = "7138d28c96d9d3e3af4ee3d8cad72741f8ffb40da90c1112235dea3ecd3178a3"
license = "LGPL-2.1-or-later; this build is GPL-3.0-or-later (--enable-gpl --enable-version3)"
os = ["windows", "macos", "linux"]

