[package]
name = "xtask"
description = "Cutweave: developer automation (`cargo xtask <ci|check-wasm|check-deps|tokens|fetch-corpus|gen>`)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# Parses `cargo metadata` output for the dependency-rule checker.
# `preserve_order` keeps token-file order (font families) so output is stable and readable.
serde_json = { workspace = true, features = ["preserve_order"] }

[lints]
workspace = true
