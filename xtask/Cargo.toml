[package]
name = "xtask"
description = "Cutweave: developer automation (`cargo xtask <ci|check-wasm|check-deps|license-headers|tokens|fetch-corpus|corpus-verify|bench|bench-check|gen-bench-project|gen|golden|golden-projects>`)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# Parses `cargo metadata` output for the dependency-rule checker.
serde_json = { workspace = true }  # preserve_order comes from the workspace (consistent ordering everywhere)

serde = { workspace = true }
toml = { workspace = true }
sha2 = { workspace = true }
similar = { workspace = true }

# TS output of `cargo xtask gen` (WP-1N.02): the same pinned specta stack the crates derive with.
specta = { workspace = true }
specta-typescript = { workspace = true }
specta-serde = { workspace = true }

# `cargo xtask gen` builds the registry the way the engine does and dumps its catalogs (WP-1N.01).
# `docs/reference/cli.md` is generated from the CLI clap definition (WP-1K.01).
# `cargo xtask gen-bench-project` and the result/budget types of `bench` and `bench-check`
# (WP-2J.01); the crate's own dependencies are ones xtask already has through cutweave-engine.
cutweave-bench = { path = "../crates/cutweave-bench" }
cutweave-cli = { path = "../crates/cutweave-cli" }
cutweave-commands = { path = "../crates/cutweave-commands" }
cutweave-engine = { path = "../crates/cutweave-engine" }
# `job.progress` for schema/events.json (WP-1D.07).
cutweave-jobs = { path = "../crates/cutweave-jobs" }
cutweave-model = { path = "../crates/cutweave-model" }
cutweave-ops = { path = "../crates/cutweave-ops" }
# `cargo xtask golden` (WP-1O.01): the comparator uses the render crate's metrics (the single
# source of the PSNR/SSIM tolerance) and its adapter list; `png` reads frames and writes
# references and diffs. Both are already in the graph (cutweave-engine, cutweave-render); these
# are only the direct edges, at the versions already locked.
cutweave-render = { path = "../crates/cutweave-render" }
png = "0.18.1"

[dev-dependencies]
# Review gate for schema/commands.json: a catalog change needs `cargo insta review` (WP-1N.01).
insta = { workspace = true }

[lints]
workspace = true
