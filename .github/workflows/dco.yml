name: DCO

# Checks that every commit in a pull request carries a Signed-off-by trailer.
# No third-party app or action is used. Merge commits are skipped.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Signed-off-by on every commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          failed=0
          for sha in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            if ! git log -1 --format=%B "$sha" | grep -Eq '^Signed-off-by: .+ <.+@.+>[[:space:]]*$'; then
              echo "::error::Commit $sha is missing a Signed-off-by trailer: $(git log -1 --format=%s "$sha")"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "Fix with: git rebase --signoff origin/main && git push --force-with-lease"
            echo "See CONTRIBUTING.md (DCO)."
            exit 1
          fi
          echo "All commits are signed off."
