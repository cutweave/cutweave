name: FFmpeg bundle

# WP-0A.06. Builds the pinned FFmpeg 8.1.x from source as shared libraries for windows-x64
# (MSYS2 UCRT64 + MSVC import libraries), macos-arm64 and linux-x64 (ubuntu:22.04 container,
# glibc 2.35), checks every required library, encoder, filter and hwaccel, and uploads
# `cutweave-ffmpeg-<ver>-<os>-<arch>.tar.zst` plus the GPL corresponding source archive
# `cutweave-ffmpeg-<ver>-source.tar.zst`. All pins live in scripts/ffmpeg/versions.toml; the
# bundles are built from the source archive, so what is published is what was compiled.
# Developers download the newest bundle with `just ffmpeg-fetch` (scripts/ffmpeg/README.md).
# Manual dispatch only, to conserve Actions minutes: run it after changing scripts/ffmpeg/.

on:
  workflow_dispatch:
    inputs:
      clean:
        description: Rebuild the static dependencies instead of restoring them from the cache
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ffmpeg-${{ github.ref }}
  cancel-in-progress: false

env:
  # Bump to throw away every cached dependency prefix.
  DEPS_CACHE_EPOCH: "1"

jobs:
  sources:
    name: sources
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.pins.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate pins
        id: pins
        run: |
          python3 scripts/ffmpeg/sources.py check
          echo "version=$(python3 scripts/ffmpeg/sources.py version)" >> "$GITHUB_OUTPUT"
      - name: Fetch and verify every pinned source
        run: python3 scripts/ffmpeg/sources.py fetch
      - name: Pack the corresponding source
        env:
          VERSION: ${{ steps.pins.outputs.version }}
        run: |
          name="cutweave-ffmpeg-$VERSION-source"
          # upstream/ is already compressed; a high zstd level would only cost time.
          tar -C third_party/ffmpeg -cf - "$name" | zstd -q -3 -T0 -o "third_party/ffmpeg/$name.tar.zst"
          {
            echo "### $name.tar.zst"
            echo
            echo "sha256 \`$(sha256sum "third_party/ffmpeg/$name.tar.zst" | cut -d' ' -f1)\`"
            echo
            echo '```'
            cat "third_party/ffmpeg/$name/SOURCES.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cutweave-ffmpeg-${{ steps.pins.outputs.version }}-source.tar.zst
          path: third_party/ffmpeg/cutweave-ffmpeg-${{ steps.pins.outputs.version }}-source.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  linux:
    name: build (linux-x64)
    needs: sources
    runs-on: ubuntu-24.04
    # ADR-0014 floor: build against glibc 2.35.
    container: ubuntu:22.04
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.sources.outputs.version }}
      BUNDLE: cutweave-ffmpeg-${{ needs.sources.outputs.version }}-linux-x64
    steps:
      - name: Bootstrap container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates zstd
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build tools
        id: tools
        run: bash scripts/ffmpeg/install-tools.sh linux
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cutweave-ffmpeg-${{ env.VERSION }}-source.tar.zst
          path: third_party/ffmpeg
      - name: Unpack sources
        run: zstd -dc "third_party/ffmpeg/cutweave-ffmpeg-$VERSION-source.tar.zst" | tar -xf - -C third_party/ffmpeg
      - name: Restore static dependencies
        id: deps
        if: ${{ !inputs.clean }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: third_party/ffmpeg/build/deps
          key: ffmpeg-deps-${{ env.DEPS_CACHE_EPOCH }}-linux-x64-${{ steps.tools.outputs.toolchain }}-${{ hashFiles('scripts/ffmpeg/versions.toml', 'scripts/ffmpeg/lib.sh', 'scripts/ffmpeg/build-deps.sh', 'scripts/ffmpeg/install-tools.sh') }}
      - name: Build static dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: bash scripts/ffmpeg/build-deps.sh
      - name: Save static dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: third_party/ffmpeg/build/deps
          key: ffmpeg-deps-${{ env.DEPS_CACHE_EPOCH }}-linux-x64-${{ steps.tools.outputs.toolchain }}-${{ hashFiles('scripts/ffmpeg/versions.toml', 'scripts/ffmpeg/lib.sh', 'scripts/ffmpeg/build-deps.sh', 'scripts/ffmpeg/install-tools.sh') }}
      - name: Build FFmpeg
        run: bash scripts/ffmpeg/build-ffmpeg.sh
      - name: Package
        env:
          CW_SOURCE_ARCHIVE: third_party/ffmpeg/cutweave-ffmpeg-${{ env.VERSION }}-source.tar.zst
        run: bash scripts/ffmpeg/package.sh
      - name: Acceptance checks
        run: bash scripts/ffmpeg/verify.sh "third_party/ffmpeg/build/dist/$BUNDLE.tar.zst" linux
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.BUNDLE }}.tar.zst
          path: third_party/ffmpeg/build/dist/${{ env.BUNDLE }}.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ffmpeg-build-logs-linux-x64
          path: |
            third_party/ffmpeg/build/**/config.log
            third_party/ffmpeg/build/**/meson-log.txt
            third_party/ffmpeg/build/**/CMakeConfigureLog.yaml
          if-no-files-found: ignore
          retention-days: 14

  macos:
    name: build (macos-arm64)
    needs: sources
    runs-on: macos-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.sources.outputs.version }}
      BUNDLE: cutweave-ffmpeg-${{ needs.sources.outputs.version }}-macos-arm64
      # ADR-0014 proposal: macOS 13+.
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build tools
        id: tools
        run: bash scripts/ffmpeg/install-tools.sh macos
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cutweave-ffmpeg-${{ env.VERSION }}-source.tar.zst
          path: third_party/ffmpeg
      - name: Unpack sources
        run: zstd -dc "third_party/ffmpeg/cutweave-ffmpeg-$VERSION-source.tar.zst" | tar -xf - -C third_party/ffmpeg
      - name: Restore static dependencies
        id: deps
        if: ${{ !inputs.clean }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: third_party/ffmpeg/build/deps
          key: ffmpeg-deps-${{ env.DEPS_CACHE_EPOCH }}-macos-arm64-${{ steps.tools.outputs.toolchain }}-${{ hashFiles('scripts/ffmpeg/versions.toml', 'scripts/ffmpeg/lib.sh', 'scripts/ffmpeg/build-deps.sh', 'scripts/ffmpeg/install-tools.sh') }}
      - name: Build static dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: bash scripts/ffmpeg/build-deps.sh
      - name: Save static dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: third_party/ffmpeg/build/deps
          key: ffmpeg-deps-${{ env.DEPS_CACHE_EPOCH }}-macos-arm64-${{ steps.tools.outputs.toolchain }}-${{ hashFiles('scripts/ffmpeg/versions.toml', 'scripts/ffmpeg/lib.sh', 'scripts/ffmpeg/build-deps.sh', 'scripts/ffmpeg/install-tools.sh') }}
      - name: Build FFmpeg
        run: bash scripts/ffmpeg/build-ffmpeg.sh
      - name: Package
        env:
          CW_SOURCE_ARCHIVE: third_party/ffmpeg/cutweave-ffmpeg-${{ env.VERSION }}-source.tar.zst
        run: bash scripts/ffmpeg/package.sh
      - name: Acceptance checks
        run: bash scripts/ffmpeg/verify.sh "third_party/ffmpeg/build/dist/$BUNDLE.tar.zst" macos
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.BUNDLE }}.tar.zst
          path: third_party/ffmpeg/build/dist/${{ env.BUNDLE }}.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ffmpeg-build-logs-macos-arm64
          path: |
            third_party/ffmpeg/build/**/config.log
            third_party/ffmpeg/build/**/meson-log.txt
            third_party/ffmpeg/build/**/CMakeConfigureLog.yaml
          if-no-files-found: ignore
          retention-days: 14

  windows:
    name: build (windows-x64)
    needs: sources
    runs-on: windows-latest
    timeout-minutes: 240
    defaults:
      run:
        # The MSYS2 preinstalled on the runner image (no third-party setup action).
        shell: C:\msys64\usr\bin\bash.exe --login -eo pipefail {0}
    env:
      MSYSTEM: UCRT64
      CHERE_INVOKING: "1"
      MSYS2_PATH_TYPE: minimal
      VERSION: ${{ needs.sources.outputs.version }}
      BUNDLE: cutweave-ffmpeg-${{ needs.sources.outputs.version }}-windows-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build tools
        id: tools
        run: bash scripts/ffmpeg/install-tools.sh windows
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cutweave-ffmpeg-${{ env.VERSION }}-source.tar.zst
          path: third_party/ffmpeg
      - name: Unpack sources
        run: zstd -dc "third_party/ffmpeg/cutweave-ffmpeg-$VERSION-source.tar.zst" | tar -xf - -C third_party/ffmpeg
      - name: Restore static dependencies
        id: deps
        if: ${{ !inputs.clean }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: third_party/ffmpeg/build/deps
          key: ffmpeg-deps-${{ env.DEPS_CACHE_EPOCH }}-windows-x64-${{ steps.tools.outputs.toolchain }}-${{ hashFiles('scripts/ffmpeg/versions.toml', 'scripts/ffmpeg/lib.sh', 'scripts/ffmpeg/build-deps.sh', 'scripts/ffmpeg/install-tools.sh') }}
      - name: Build static dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: bash scripts/ffmpeg/build-deps.sh
      - name: Save static dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: third_party/ffmpeg/build/deps
          key: ffmpeg-deps-${{ env.DEPS_CACHE_EPOCH }}-windows-x64-${{ steps.tools.outputs.toolchain }}-${{ hashFiles('scripts/ffmpeg/versions.toml', 'scripts/ffmpeg/lib.sh', 'scripts/ffmpeg/build-deps.sh', 'scripts/ffmpeg/install-tools.sh') }}
      - name: Build FFmpeg
        run: bash scripts/ffmpeg/build-ffmpeg.sh
      - name: Package
        env:
          CW_SOURCE_ARCHIVE: third_party/ffmpeg/cutweave-ffmpeg-${{ env.VERSION }}-source.tar.zst
        run: bash scripts/ffmpeg/package.sh
      - name: Acceptance checks
        run: bash scripts/ffmpeg/verify.sh "third_party/ffmpeg/build/dist/$BUNDLE.tar.zst" windows
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.BUNDLE }}.tar.zst
          path: third_party/ffmpeg/build/dist/${{ env.BUNDLE }}.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ffmpeg-build-logs-windows-x64
          path: |
            third_party/ffmpeg/build/**/config.log
            third_party/ffmpeg/build/**/meson-log.txt
            third_party/ffmpeg/build/**/CMakeConfigureLog.yaml
          if-no-files-found: ignore
          retention-days: 14
