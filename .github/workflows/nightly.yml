name: Nightly

# Skeleton (WP-0A.03). Benchmark smoke + corpus jobs added by WP-0I.01/0I.03; soak and e2e in P2.

on:
  # Manual only for now (saves Actions minutes); re-enable the schedule once runners/budget allow.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-ci:
    name: full-check (${{ matrix.os }})
    if: github.repository == 'cutweave/cutweave'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.100.0"
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --workspace

  soak:
    name: soak (placeholder)
    if: github.repository == 'cutweave/cutweave'
    runs-on: ubuntu-24.04
    steps:
      - run: echo "30-minute A/V soak arrives in WP-0I.03"

  bench:
    # Informational (WP-0I.03): runs the harness and uploads the result JSON; never blocks.
    # Hosted runners are not reference machines, so results are tagged `ci-hosted`. Self-hosted
    # `bench-ref` matrix over the ref-* labels arrives in WP-0I.04; real suites arrive in P2.
    name: bench (${{ matrix.os }})
    if: github.repository == 'cutweave/cutweave'
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14, ubuntu-24.04]
    env:
      CUTWEAVE_BENCH_MACHINE: ci-hosted
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.100.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo xtask bench --suite smoke --out bench-results.json
      - run: cargo xtask bench-check bench-results.json
      # TODO(integrator): pin this action to a commit SHA like the others (the SHA could not be looked up offline).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench-${{ matrix.os }}
          path: bench-results.json

  corpus:
    # Informational: fetches the full corpus (cached on the manifest hash) and verifies it.
    name: corpus (full tier)
    if: github.repository == 'cutweave/cutweave'
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.100.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: testdata/corpus
          key: corpus-full-${{ hashFiles('testdata/corpus.toml', 'testdata/generate/*.sh') }}
      - run: cargo xtask fetch-corpus --tier full
      - run: cargo xtask corpus-verify --tier full
