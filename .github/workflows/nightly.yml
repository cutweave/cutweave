name: Nightly

# Skeleton (WP-0A.03). Soak and benchmark jobs are filled by WP-0I.03; full corpus and e2e in P2.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-ci:
    name: full-check (${{ matrix.os }})
    if: github.repository == 'cutweave/cutweave'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.100.0"
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --workspace

  soak:
    name: soak (placeholder)
    if: github.repository == 'cutweave/cutweave'
    runs-on: ubuntu-24.04
    steps:
      - run: echo "30-minute A/V soak arrives in WP-0I.03"

  bench:
    name: bench (placeholder)
    if: github.repository == 'cutweave/cutweave'
    runs-on: ubuntu-24.04
    steps:
      - run: echo "Benchmarks against budgets on self-hosted reference runners arrive in WP-0I.03"
