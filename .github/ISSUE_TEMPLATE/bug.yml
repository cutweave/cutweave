name: Bug report
description: Something does not work as expected
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: |
        Security issue? Do not file it here. Use a private security advisory (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps. Attach a project file or command list if you can.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Cutweave version or commit
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: GPU and driver
  - type: dropdown
    id: surface
    attributes:
      label: Where did it happen
      options: [UI, CLI, MCP, JSON-RPC / local API, Plugin, Export, Other]
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Remove API keys, tokens and private paths first.
      render: shell
