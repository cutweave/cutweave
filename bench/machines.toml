# Reference machine registry (docs/reference-machines.md, WP-0I.02). Source of truth for the
# `machine` field of bench result JSON (bench/result.schema.json) and for the machine ids used in
# `machine_scope` rows of bench/budgets.toml. Informational today: `cargo xtask bench` does not read
# this file yet (it takes the id from CUTWEAVE_BENCH_MACHINE); WP-0I.04 may add an id check.
# status: "owned" (exists, verified), "interim" (stand-in that deviates from the plan),
#         "tbd" (not purchased; owner/due recorded). Keep in sync with the doc tables.

[[machine]]
id = "ref-win-dgpu"
status = "owned"
owner = "product owner (maintainer laptop)"
os = "Windows 11 Pro 10.0.26200"
cpu = "AMD Ryzen 9 5900HX (8C/16T)"
gpu = "NVIDIA GeForce RTX 3080 Laptop GPU (discrete)"
ram_gb = 31
storage = "NVMe, 1.9 TB data volume"
audio = "WASAPI; wired output + loopback fixture TBD (wireless headset only for informal soak)"
display_server = "windows"
runner_label = "ref-win-dgpu"
adapter_forced = "NVIDIA"

