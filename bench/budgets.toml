# Performance budgets: one row per docs/01-architecture.md §19 line (WP-0I.03).
# Row: id, metric (what is measured), op (< <= >= >), value, unit, machine_scope.
# machine_scope: ["any"] or reference-machine ids (docs/reference-machines.md, WP-0I.02); a result from
# a machine outside the scope is not checked against that row. Changing a row changes the architecture
# contract: update §19 in the same PR.

[[budget]]
id = "app_start_ms"
metric = "App start to an editable empty project"
op = "<"
value = 2500
unit = "ms"
machine_scope = ["any"]

