# Cutweave test-media corpus manifest (WP-0I.01; docs/01-architecture.md §7, §20, §21).
#
# Media is never committed: `cargo xtask fetch-corpus [--tier small|full]` (or `just corpus`) downloads
# or generates every item into the git-ignored `testdata/corpus/`, verifying sha256. Tests locate files
# by id. `cargo xtask corpus-verify` re-checks the cache.
#
# Fields per [[item]]
#   id, category, description, purpose, codec, container, tags
#   file            file name inside testdata/corpus/
#   tier            "small" (< 50 MB total, fetched on PR CI) or "full" (nightly)
#   license         CC0-1.0 | CC-BY-3.0 | CC-BY-4.0 | public-domain | self-generated   (required)
#   attribution     required for CC-BY; credit line reproduced in testdata/README.md
#   license_review  true = claimed license must be audited at file level before the item is relied on
#   source_url      download URL (http(s):// or file://)          } exactly one of
#   generate        recipe, run as `bash <recipe> <output-file>`   } these two
#   sha256, size    "PENDING" / 0 until the first fetch; `cargo xtask fetch-corpus --pin` writes them.
#                   Generated items are byte-pinned only for the ffmpeg version in [meta]; if a later
#                   build differs, compare stream properties (probe_hash) instead and re-pin.
#   url_verified    false = URL written from the upstream project's documented layout, not yet fetched

[meta]
schema = 1
# Version used to pin generated-item hashes; set on first generation (FFmpeg is not provisioned yet).
ffmpeg_version = "PENDING"


