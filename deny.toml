# cargo-deny policy (WP-0A.04; docs/01-architecture.md §21). Run: `cargo deny check`.

[graph]
# The FFmpeg-enabled graph is checked too (cutweave-media's `ffmpeg` feature is off by default, so
# without this its dependencies would never be scanned). Resolving it needs no FFmpeg install.
features = ["cutweave-media/ffmpeg"]
targets = [
  "x86_64-pc-windows-msvc",
  "aarch64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "wasm32-unknown-unknown",
]

[advisories]
unmaintained = "workspace"
yanked = "deny"
ignore = []

[licenses]
# GPL-3.0-compatible only. Disallowed (by omission): GPL-2.0-only, AGPL, SSPL, non-commercial,
# proprietary and anything unclear.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "MPL-2.0",
  "Unicode-3.0",
  "CC0-1.0",
  "GPL-2.0-or-later",
  "GPL-3.0-only",
  "GPL-3.0-or-later",
  "LGPL-2.1-only",
  "LGPL-2.1-or-later",
  "LGPL-3.0-only",
  "LGPL-3.0-or-later",
  # ffmpeg-next and ffmpeg-sys-next, the FFmpeg bindings behind cutweave-media's `ffmpeg` feature
  # (ADR-0003, WP-1D.01). The FSF lists the WTFPL as a free license compatible with the GPL; it
  # imposes no conditions, so the combined work stays GPL-3.0-or-later.
  "WTFPL",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# Crate-level license traps (architecture §13/§21): none yet. Add `{ crate = "name", reason = ".." }`.
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
