[package]
name = "s4-compositor"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.100"
publish = false
description = "Spike S4 (WP-0F.01): render graph, linear-light compositor, LUT, tone-map, headless export. Throwaway."

# Own workspace: spikes are excluded from the root workspace (spikes/README.md).
[workspace]

[lib]
name = "s4"
path = "src/lib.rs"

[[bin]]
name = "s4"
path = "src/bin/s4.rs"

[dependencies]
wgpu = "~30.0.2"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4.6", features = ["derive"] }
anyhow = "1"
# WP-0F.02 text. Shaping (harfrust inside), no system fonts (fontconfig off) for determinism.
cosmic-text = { version = "=0.19.0", default-features = false, features = ["std"] }
# Glyph outlines for the MSDF generator and the CPU reference (already in the tree via fontdb).
ttf-parser = "0.25"
# Vello variant (wgpu 30, same device as the compositor).
vello = "=0.12.0"
# Decodes the bundled UI fonts (packages/ui/src/fonts/*.woff2) at load time (pure Rust, MIT;
# the `woff2` 0.3 crate no longer builds against bytes 1.10+).
wuff = "0.2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.dev]
# Pixel loops (CPU reference, metrics) are ~20x slower at opt-level 0.
opt-level = 2

[profile.test]
opt-level = 2
