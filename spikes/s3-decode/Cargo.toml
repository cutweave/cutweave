[package]
name = "s3-decode"
version = "0.0.0"
edition = "2024"
rust-version = "1.100"
license = "GPL-3.0-or-later"
publish = false
description = "Spike S3 (WP-0E.01/0E.02): ffmpeg-next decode, packet-scan frame index, frame-exact seek, hardware decode and GPU upload. Throwaway."

# Own workspace: spikes are excluded from the root workspace (spikes/README.md) and are throwaway.
[workspace]

[lib]
name = "s3"
path = "src/lib.rs"

[[bin]]
name = "s3"
path = "src/main.rs"

[features]
default = ["gpu"]
# WP-0E.02 path (a): upload decoded NV12/P010 (or planar) frames as wgpu textures and convert them
# to RGB in a compute shader (`s3 gpu`, texture-ready latency).
gpu = ["dep:wgpu"]
# WP-0E.02 path (b), time-boxed experiment, Windows only: D3D11VA decoder texture -> NT shared
# handle -> ID3D12Resource -> wgpu texture, with no CPU copy (`s3 zerocopy`).
zero-copy = ["gpu", "dep:windows"]

[dependencies]
# Pinned exactly: the spike measures this release. Same version the root workspace already pins
# for `cutweave-media` (feature `ffmpeg`), and the first ffmpeg-next line whose build script
# detects FFmpeg 8.1 (`ffmpeg_8_1`, lavc 62.28). Only demux + decode are needed: no swscale,
# swresample, avfilter or avdevice, so only avformat/avcodec/avutil are linked.
ffmpeg-next = { version = "=9.1.0", default-features = false, features = ["codec", "format"] }
# Same pin and feature set as `cutweave-render` (root lockfile, the version Spike S4 was proven on);
# GL is left out. Already in the registry cache, nothing new is fetched.
wgpu = { version = "=30.0.2", default-features = false, features = [
  "std",
  "parking_lot",
  "dx12",
  "metal",
  "vulkan",
  "wgsl",
], optional = true }

[target.'cfg(windows)'.dependencies]
# Zero-copy experiment only: the D3D11/D3D12/DXGI COM bindings. Must be the same 0.62 line that
# wgpu-hal 30 uses, so an `ID3D12Resource` from here is the type `texture_from_raw` takes. In the
# root lockfile already (0.62.2).
windows = { version = "0.62", optional = true, default-features = false, features = [
  "std",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Direct3D12",
] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.dev]
# Decode-forward and CRC loops are slow at opt-level 0; FFmpeg itself is prebuilt either way.
opt-level = 2

[profile.release]
debug = "line-tables-only"
