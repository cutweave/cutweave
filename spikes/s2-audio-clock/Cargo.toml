[package]
name = "s2-audio-clock"
version = "0.0.0"
edition = "2024"
rust-version = "1.100"
license = "GPL-3.0-or-later"
publish = false
description = "Spike S2 (WP-0D.01): cpal mixer, time-stretch, loudness and audio-clock-following video."

# Own workspace: spikes are excluded from the root workspace (spikes/README.md) and are throwaway.
[workspace]

[features]
default = ["window", "realtime"]
# Minimal framebuffer window for the clock-following video presenter (terminal-only without it).
window = ["dep:minifb"]
# Real-time scheduling (MMCSS on Windows) for the cpal callback thread.
realtime = ["cpal/realtime"]

# Versions are pinned exactly: the spike measures these specific releases (crates.io, 2026-11-22).
[dependencies]
cpal = "=0.18.2"
ebur128 = "=0.1.11"
minifb = { version = "=0.29.0", optional = true }
rtrb = "=0.4.1"
rubato = "=5.1.0"
signalsmith-stretch = "=0.1.3"

[profile.dev]
# Debug builds keep debug assertions (including the real-time allocation assertion in the audio
# callback) but are optimised enough to run 8 tracks of DSP in real time.
opt-level = 2

[profile.dev.package."*"]
# Also drives OPT_LEVEL for the signalsmith-stretch C++ build (cc crate).
opt-level = 3

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
