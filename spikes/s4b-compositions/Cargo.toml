[package]
name = "s4b-compositions"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.100"
publish = false
description = "Spike S4b (WP-0G.01): TS/JSX compositions via oxc -> rquickjs sandbox -> scene graph -> S4 compositor. Throwaway."

# Own workspace: spikes are excluded from the root workspace (spikes/README.md).
[workspace]

[lib]
name = "s4b"
path = "src/lib.rs"

[[bin]]
name = "s4b"
path = "src/bin/s4b.rs"

[dependencies]
# Scene graph + wgpu renderer from Spike S4 (WP-0F.01).
s4-compositor = { path = "../s4-compositor" }
# TS/JSX -> JS transpile, semantic checks, codegen with source maps (pinned exactly: 0.x API churns).
oxc = { version = "=0.159.0", features = ["codegen", "semantic", "transformer", "ast_visit"] }
# QuickJS-ng bindings (pinned exactly). No `loader`/`futures`/`macro` features: no module loader,
# no host I/O. `disable-assertions` turns QuickJS's C asserts off (on by default: 2.2x slower).
rquickjs = { version = "=0.14.0", default-features = false, features = ["std", "disable-assertions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4.6", features = ["derive"] }
anyhow = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.dev]
# The S4 dependency has pixel loops (CPU reference, metrics).
opt-level = 2

[profile.test]
opt-level = 2
