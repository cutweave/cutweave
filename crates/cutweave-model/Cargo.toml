[package]
name = "cutweave-model"
description = "Cutweave: project document types, flicks time, IDs, schema and migrations (wasm-safe)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
# Proptest strategies (`cutweave_model::testing`), reused by cutweave-ops property tests (WP-1B.07).
testing = ["dep:proptest"]

[dependencies]
imbl.workspace = true
schemars.workspace = true
serde.workspace = true
# `float_roundtrip`: saved floats (opacity, gain, transforms) must load back bit-identically.
serde_json = { workspace = true, features = ["float_roundtrip"] }
serde_path_to_error.workspace = true
specta.workspace = true
# Only for the `Time` -> TS `number` override (`specta_typescript::Number`); no exporter runs here.
specta-typescript.workspace = true
thiserror.workspace = true
# Keyframe easing (WP-2C.02, keyframes §6): pure-Rust exp/sin/cos/pow, so spring and colour curves
# are bit-identical on every platform and in the wasm module (WP-2C.06). Platform libms differ in
# the last bits. MIT; no dependencies; already in the lockfile (through num-traits and naga).
libm = "0.2.16"
# The fold that compares tags and matches media search (ADR-0036: case and accents ignored): NFD
# decomposition and the combining-mark test. Pure Rust, no_std, wasm-clean; not a new crate in the
# build (cutweave-ops used it for the same fold, which moved here with `MediaFilter`).
unicode-normalization = "0.1"
proptest = { workspace = true, optional = true }

# Real UUIDv7 needs OS entropy and a wall clock, which wasm32-unknown-unknown lacks. There the
# engine injects an `IdGen` instead (e.g. `SeededGen`).
[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
uuid.workspace = true

[dev-dependencies]
criterion.workspace = true
insta.workspace = true
proptest.workspace = true
specta.workspace = true
specta-serde.workspace = true
specta-typescript.workspace = true

# Keyframe evaluation budget (WP-2C.02): 30 animated properties at one time, 50k-key lookup.
[[bench]]
name = "animate"
harness = false

[lints]
workspace = true

# Snap lookup budget (WP-2A.07): 50,000 candidates, under 0.1 ms.
[[bench]]
name = "snap"
harness = false
