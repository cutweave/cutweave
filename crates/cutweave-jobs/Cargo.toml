[package]
name = "cutweave-jobs"
description = "Cutweave: job queue, progress, cancellation and the decode/export budget"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# `IdGen` (job IDs come from the engine's injected generator, ADR-0015) and `MediaId`.
cutweave-model = { path = "../cutweave-model" }
# The export queue's store, `<project>/.cutweave/exports.sqlite` (WP-2G.03a, ADR-0030): the
# workspace's bundled SQLite, already used by cutweave-cache for `cache.sqlite` (no new crate).
rusqlite.workspace = true
# Wire types of the `job.*` commands and the `job.progress` event (JSON Schema, TS types).
schemars.workspace = true
serde.workspace = true
specta.workspace = true
thiserror.workspace = true
# Worker pool (`spawn_blocking`), the budget semaphores, `job.progress` broadcast and async
# waits. Pinned exactly like cutweave-api's (already in Cargo.lock; no new crate). Not wasm32:
# this crate is engine-side only (it is not in `cargo xtask check-wasm`'s list).
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "sync", "time", "macros"] }
# Diagnostics (jobs that panic, unknown dependencies).
tracing.workspace = true

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
