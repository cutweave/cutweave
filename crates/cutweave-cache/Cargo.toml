[package]
name = "cutweave-cache"
description = "Cutweave: frame cache, thumbnails, waveform pyramids, proxy manager and SQLite index"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
# Corpus tests against the FFmpeg backend (`tests/ffmpeg_thumbs.rs`, `tests/waveform_corpus.rs`);
# needs the bundle: see docs/dev/ffmpeg.md (`. scripts/ffmpeg/env.sh`).
ffmpeg = ["cutweave-media/ffmpeg"]

[dependencies]
# `FrameIndex` and the `MediaBackend` that builds it (default features: the trait half only).
cutweave-media = { path = "../cutweave-media" }
cutweave-model = { path = "../cutweave-model" }
# Thumbnails are encoded with its baseline JPEG encoder (no IJG-licensed crate needed); the pure
# core only (`gpu` off), so no wgpu is pulled in.
cutweave-render = { path = "../cutweave-render", default-features = false }
# `submit_prefetch`: generation as a background job under the decode budget (WP-1D.07).
cutweave-jobs = { path = "../cutweave-jobs" }
# ETags: a hash of the request parameters (already used by cutweave-media).
blake3.workspace = true
# The OS cache directory (`ThumbConfig::default_dir`).
dirs.workspace = true
thiserror.workspace = true
# Logs: proxies evicted by the size cap, a proxy whose sound could not be decoded (WP-2F.01). The
# workspace's pinned `tracing`, already used by cutweave-media and cutweave-jobs.
tracing.workspace = true
# `cache.sqlite`.
rusqlite.workspace = true
# The waveform PNG helper (WP-1D.06); already in the lockfile through cutweave-render.
png = "0.18.1"

[dev-dependencies]
proptest.workspace = true
# Decodes the generated JPEGs in tests (the same pinned version cutweave-render's tests use).
zune-jpeg = "=0.5.15"

[lints]
workspace = true
