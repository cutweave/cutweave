[package]
name = "cutweave-commands"
description = "Cutweave: Command and Query traits, registry, transactions, patches, undo and the document actor"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# `#[command]` / `#[query]` / `#[wire]`, re-exported from this crate.
cutweave-commands-derive = { path = "../cutweave-commands-derive" }
cutweave-model = { path = "../cutweave-model" }
imbl.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
# JSON Pointer of the offending param in `CmdError::Invalid` ("/at", "/items/1").
serde_path_to_error.workspace = true
specta.workspace = true
# Only for TS `number` overrides of 64-bit integers (`specta_typescript::Number`, e.g. `Rev`).
specta-typescript.workspace = true
thiserror.workspace = true
# Doc actor diagnostics (caught command panics, conflicts between open transactions).
tracing.workspace = true

# The doc actor's thread host (WP-1B.03) is native-only; the document state machine (`DocState`)
# stays wasm32-clean.
[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
# Lock-free snapshot publication: `DocHandle::snapshot()` never blocks (arch §5.2).
arc-swap.workspace = true

# Model checking of the actor's concurrency protocol (`--cfg cutweave_loom` builds only).
[target.'cfg(cutweave_loom)'.dependencies]
loom.workspace = true

[dev-dependencies]
cutweave-model = { path = "../cutweave-model", features = ["testing"] }
criterion.workspace = true
proptest.workspace = true
specta-serde.workspace = true

[[bench]]
name = "doc_actor"
harness = false

[[bench]]
name = "soft_lock"
harness = false

[lints]
workspace = true
