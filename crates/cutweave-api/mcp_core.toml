#
# The core MCP tools (WP-2I.01; arch §14, ADR-0009): the tools the standard profile lists
# next to the 4 generic ones, and what each listing says. This file is the checked-in gate of
# the tool list: a command marked `mcp = "core"` that is missing here (or the reverse) fails
# `cargo nextest run -p cutweave-api`, and so does a list beyond its budget in `[profiles]`.
#
# - `name`: the tool. It is the command name with `.` replaced by `_`; an entry whose name is
#   not that needs an ADR (arch §14).
# - `command`: the registered command or query the tool runs. The tool is only that call:
#   the input schema, the result and the errors are the command's.
# - `description`: what an agent reads in `tools/list`, without the example. Plain, present
#   tense, what it changes and what comes back. No parameter reference: parameter docs are in
#   `cutweave_describe_command` (listed schemas carry validation only, to fit the budget).
# - `example`: one valid arguments object. `…` stands for the 32 hex digits of an id. The
#   listed description is `<description> E.g. <example>` and is at most 300 characters.
# - `always_load` (WP-2I.07, default false): the listing carries `_meta`
#   `"anthropic/alwaysLoad": true`, which asks a client that defers tool definitions (Claude
#   Code's tool search) to load this tool at the start. At most 5 tools: the ones an agent
#   needs before it can search. Clients that do not know the key ignore it. `[[generic]]` sets
#   it for the generic tools, whose listings are in `src/mcp/catalog.rs`.
#
# `[[namespace]]` gives each command namespace one line for the server instructions (the list
# of namespaces itself comes from the registry; a test fails when the two differ).
#
# `[keywords]` holds words a user would say, by command or query name (one lower-case word
# each): `cutweave_search_commands` matches them next to names and summaries. A key that is not
# a registered command fails the tests. No command is renamed for search.
#
# `[[pending]]` names tools of the plan that are not listed yet, and what brings them.
#
# Generated from this file: docs/reference/mcp-core-tools.md (`cargo xtask gen`).

[profiles]
# The tool-list budget of every profile, and the only place the figures are written: the
# endpoints, `cutweave mcp --profile`, the tests and the generated reference read them from
# here (WP-2I.05; ADR-0040: "the budgets live in `mcp_core.toml` per profile"). A list that
# leaves its budget fails `cargo nextest run -p cutweave-api`. `max_tools` counts the 4
# generic tools; `max_tokens` is `ceil(bytes / 4)` of the compact `tools/list` result.
#
# - `minimal` (`/mcp/minimal`): look, wait, undo and the generic tools, for small context
#   windows (arch §14).
# - `standard` (`/mcp`): the core tools, for clients that load every definition at the start
#   (arch §14, R36). `full` (`/mcp/full`) lists exactly the standard tools and has this budget:
#   its long tail is found with `cutweave_search_commands`, not listed.
# - `described` (`/mcp/described`): the standard tools in the same order with full parameter
#   descriptions, for clients that defer tool definitions (Claude Code, Copilot CLI) and so do
#   not pay for the list at the start (ADR-0040, question 2).
minimal = { max_tools = 12, max_tokens = 3000 }
standard = { max_tools = 36, max_tokens = 8000 }
described = { max_tools = 36, max_tokens = 16000 }

[[tool]]
name = "audio_set"
command = "audio.set"
description = "Set a clip's fades, volume (dB) or pan; `set.kind` picks which."
example = '{"item":"itm_…","set":{"kind":"fade","in":"0.5s","out":"1s"}}'

[[tool]]
name = "clip_set_speed"
command = "clip.set_speed"
description = "Change a clip's playback speed, 0.1x to 100x; its length changes unless keep is \"duration\". Linked partners follow."
example = '{"item":"itm_…","speed":"2x"}'

[[tool]]
name = "clip_split"
command = "clip.split"
description = "Split a clip and its linked partners at a timeline time inside it; returns the left and right ids."
example = '{"item":"itm_…","at":"2.5s"}'

[[tool]]
name = "clip_trim"
command = "clip.trim"
description = "Move a clip's start or end edge to a time (`to`) or by an amount (`delta`). Linked partners follow; the main track closes up."
example = '{"item":"itm_…","edge":"end","delta":"-0.5s"}'

[[tool]]
name = "edit_checkpoint"
command = "edit.checkpoint"
description = "Save a restore point of the document before risky edits; cheap. Returns its id."
example = '{"name":"before-recut"}'

[[tool]]
name = "edit_redo"
command = "edit.redo"
description = "Redo your last undone change (`steps` for more)."
example = '{}'

[[tool]]
name = "edit_restore"
command = "edit.restore"
description = "Bring the document back to a checkpoint (id or name) as one undoable change; refuses to revert other actors' edits unless force is true."
example = '{"checkpoint":"before-recut"}'

[[tool]]
name = "edit_undo"
command = "edit.undo"
description = "Undo your last change (`steps` for more); other actors' later edits are kept."
example = '{"steps":2}'

[[tool]]
name = "export_start"
command = "export.start"
description = "Export a sequence to a video file as a background job; returns job_id for job_wait. Presets: export.list_presets."
example = '{"path":"C:/out/cut.mp4","preset":"youtube-1080p"}'

[[tool]]
name = "item_delete"
command = "item.delete"
description = "Delete items and their linked partners; the main track closes up, other tracks keep the gap."
example = '{"items":["itm_…"]}'

[[tool]]
name = "item_move"
command = "item.move"
description = "Move items to a time (`start`) or by `delta`, and/or to another track (`to_track`). Linked partners follow."
example = '{"item":"itm_…","start":"6s"}'

[[tool]]
name = "item_set_props"
command = "item.set_props"
description = "Set some of an item's properties: name, enabled, opacity, audio gain and pan, transform, crop, flip, blend mode. The rest stay."
example = '{"item":"itm_…","props":{"opacity":0.5,"transform":{"scale":{"x":1.2,"y":1.2}}}}'

[[tool]]
name = "job_status"
command = "job.status"
description = "Get a background job's state, progress and error (media analysis, export)."
example = '{"id":"job_…"}'

[[tool]]
name = "job_wait"
command = "job.wait"
description = "Wait for a background job to finish, at most timeout_ms (max 60000); returns its state. Call again while it is running."
example = '{"job_id":"job_…","timeout_ms":30000}'

[[tool]]
name = "keyframe_set"
command = "keyframe.set"
description = "Animate one property of an item: add or replace keys at sequence times (`at`) or item times (`t`), with an easing to the next key."
example = '{"item":"itm_…","prop":"opacity","keys":[{"at":"6s","value":0,"easing":"ease_out"},{"at":"8s","value":1}]}'

[[tool]]
name = "media_import"
command = "media.import"
description = "Import media files by absolute path. Returns media_ids at once; analysis runs as jobs (job_ids) that job_wait waits for."
example = '{"paths":["C:/footage/a.mp4"]}'

[[tool]]
name = "media_list"
command = "media.list"
description = "List the project's media with ids, kinds and durations; filter, sort and page."
example = '{"filter":{"kinds":["video"],"used":false},"limit":20}'

[[tool]]
name = "project_info"
command = "project.info"
description = "Get the project's name, default format and its sequences with their ids. Start here."
example = '{}'
always_load = true

[[tool]]
name = "project_open"
command = "project.open"
description = "Open a project folder or .cutweave file; the current project closes. Fails if that would lose unsaved changes."
example = '{"path":"C:/projects/trip"}'

[[tool]]
name = "render_frame"
command = "render.frame"
description = "See the frame at a time: returns an image (JPEG, 768 px by default) and the items on screen. Not usable inside cutweave_execute."
example = '{"t":"2.5s"}'

[[tool]]
name = "sequence_create"
command = "sequence.create"
description = "Add a sequence from an aspect preset (\"16:9\", \"9:16\", \"1:1\", ...) or an explicit format; `main_magnetic: true` makes V1 the magnetic main track; returns its id and tracks."
example = '{"name":"Short","preset":"9:16"}'

[[tool]]
name = "sequence_set_format"
command = "sequence.set_format"
description = "Change a sequence's size, frame rate, sample rate or background; `reframe` says how items adapt to a new size."
example = '{"sequence":"seq_…","width":1080,"height":1920}'

[[tool]]
name = "timeline_add_marker"
command = "timeline.add_marker"
description = "Add a marker at a time of a sequence, or on one of its items (`item`; then `t` is from the item's start). `duration` makes it a range."
example = '{"sequence":"seq_…","t":"12s","label":"Cut here"}'

[[tool]]
name = "timeline_get"
command = "timeline.get"
description = "Read a sequence: depth 0 summary, 1 tracks with counts (default), 2 items with ids and times. Page a long one with `range`, `limit` and `cursor`; `detail` \"concise\" is half the size."
example = '{"sequence":"seq_…","depth":2,"limit":50}'
always_load = true

[[tool]]
name = "timeline_insert"
command = "timeline.insert"
description = "Place a media clip on a track at a time; video with sound also gets a linked audio clip. Returns the new clip ids."
example = '{"sequence":"seq_…","track":"trk_…","media":"med_…","at":"0s"}'

[[tool]]
name = "track_add"
command = "track.add"
description = "Add an empty track to a sequence; returns its id."
example = '{"sequence":"seq_…","kind":"video"}'

[[tool]]
name = "view_get"
command = "view.get"
description = "Read what the user sees in the app: playhead, selection, zoom, active sequence, source in/out marks."
example = '{}'

[[tool]]
name = "view_set"
command = "view.set"
description = "Show the user something in the app: move the playhead, select items, zoom or switch sequence. Changes only the view; not undoable."
example = '{"patch":{"playhead":"12s","selection":[{"kind":"item","id":"itm_…"}]}}'

