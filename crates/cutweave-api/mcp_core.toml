# ----- the generic tools ---------------------------------------------------------------------

[[generic]]
name = "cutweave_search_commands"
always_load = true

[[generic]]
name = "cutweave_describe_command"
always_load = true

[[generic]]
name = "cutweave_execute"
always_load = true

[[generic]]
name = "cutweave_query"

# ----- the namespaces, for the server instructions -------------------------------------------

[[namespace]]
name = "audio"
purpose = "a clip's volume, fades and pan; loudness of the mix"

[[namespace]]
name = "clip"
purpose = "edit one clip: split, trim, ripple, roll, slip, slide, speed, reverse, freeze, replace"

[[namespace]]
name = "edit"
purpose = "undo, redo, history, checkpoints and transactions"

[[namespace]]
name = "export"
purpose = "render a sequence to a file: presets, encoders and the export queue"

[[namespace]]
name = "item"
purpose = "anything on a track: move, delete, duplicate, link, properties (opacity, transform, crop), layouts"

[[namespace]]
name = "job"
purpose = "background work (import analysis, proxies, export): status, wait, cancel"

[[namespace]]
name = "keyframe"
purpose = "animate a property over time: set, move, delete keys, easing"

[[namespace]]
name = "media"
purpose = "the media bin: import, list, folders, tags, collections, proxies, relink missing files"

[[namespace]]
name = "project"
purpose = "open, save, close, settings, collect and archive"

[[namespace]]
name = "render"
purpose = "see a frame of the timeline as a picture"

[[namespace]]
name = "sequence"
purpose = "timelines of the project: create, duplicate, size and frame rate, background"

[[namespace]]
name = "timeline"
purpose = "read a sequence and place things on it: insert, overwrite, gaps, ripple delete, markers, copy and paste"

[[namespace]]
name = "track"
purpose = "add, remove, reorder tracks; mute, solo, lock, hide"

[[namespace]]
name = "view"
purpose = "what the user sees in the app: playhead, selection, zoom"

