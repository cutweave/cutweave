[package]
name = "cutweave-api"
description = "Cutweave: JSON-RPC over WebSocket, MCP, HTTP media endpoints and auth"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "cutweave-api-serve"
path = "src/bin/cutweave-api-serve.rs"

# WP-1I.01 dependencies (each needs a justification in the PR; all are pinned exactly).
[dependencies]
cutweave-commands = { path = "../cutweave-commands" }
# HTTP server and routing; `ws` (WP-1I.02): the JSON-RPC WebSocket at `/rpc` (pulls
# tokio-tungstenite 0.29, the client the RPC tests use too).
axum = { version = "=0.8.9", default-features = false, features = ["tokio", "http1", "json", "ws"] }
# Async runtime (the listener, signals, handshake pipe).
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "io-util", "io-std", "time"] }
# Constant-time token comparison.
subtle = "=2.6.1"
# 256-bit tokens from the OS CSPRNG.
getrandom = "=0.4.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
# WP-1I.02: `SinkExt::feed`/`flush`, so a WebSocket writes queued responses and events with one
# flush (already in the graph through axum's `ws`; same license, pinned like the lockfile).
futures-util = { version = "=0.3.34", default-features = false, features = ["sink", "std"] }
# WP-1J.01: the MCP server (`/mcp`, arch §14, ADR-0009). The official Rust SDK, pinned exactly
# (3.x churns between minors) at the version and feature set Spike S5 validated against both
# spec revisions (2025-11-25 and 2026-07-28). Streamable HTTP server only; stdio is WP-1J.03.
rmcp = { version = "=3.11.0", default-features = false, features = ["server", "transport-streamable-http-server"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "time"] }
# WP-1I.02 RPC integration tests: a real engine in-process (a dev-only cycle; the engine depends on
# this crate, and integration tests link the one library both use), the event-replay mirror and
# the command strategies of `cutweave-ops/testing`, and a WebSocket client: tokio-tungstenite at
# the version axum's `ws` feature already pulls in.
cutweave-engine = { path = "../cutweave-engine" }
cutweave-model = { path = "../cutweave-model", features = ["testing"] }
cutweave-ops = { path = "../cutweave-ops", features = ["testing"] }
tokio-tungstenite = "=0.29.0"
proptest.workspace = true
# WP-1J.01 MCP tests (on the engine's production `/mcp` mount): the analysis-job types of the fake
# media subsystem, rmcp's own Streamable HTTP client (reqwest, no TLS: loopback only) and the
# `tools/list` snapshot.
cutweave-jobs = { path = "../cutweave-jobs" }
rmcp = { version = "=3.11.0", default-features = false, features = ["server", "transport-streamable-http-server", "client", "transport-streamable-http-client-reqwest"] }
insta = { workspace = true }

[lints]
workspace = true
