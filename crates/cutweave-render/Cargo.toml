[package]
name = "cutweave-render"
description = "Cutweave: timeline evaluation, scene graph, render graph and wgpu passes (wasm-safe core)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[features]
default = ["gpu"]
# The wgpu executor (`gpu` module, WP-1F.02). Native targets only: on wasm32-unknown-unknown the
# optional dependencies below do not exist and the crate is the pure core (evaluation, colour and
# geometry math, render graph, CPU reference, metrics), as `cargo xtask check-wasm` requires.
gpu = ["dep:wgpu", "dep:tracing"]
# The golden-frame harness (`golden` module: PNG references stored per adapter class), for the
# crate's own tests and for the WP-1O.01 `cutweave render` golden runner.
golden = ["gpu", "dep:png"]

[dependencies]
cutweave-model = { path = "../cutweave-model" }
serde.workspace = true
thiserror.workspace = true

[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
# GPU compositor (arch §8; tech stack pin 30.0.2, the version Spike S4 was proven on). GL is left
# out: it has no storage-texture parity with the other backends (S4); WebGPU is the future
# browser build (§22), not this native executor.
wgpu = { version = "=30.0.2", default-features = false, features = [
  "std",
  "parking_lot",
  "dx12",
  "metal",
  "vulkan",
  "wgsl",
], optional = true }
# Device-lost, watchdog and adapter diagnostics (AGENTS.md: `tracing` for logs).
tracing = { version = "0.1.44", optional = true }
# Reads and writes golden reference frames.
png = { version = "0.18.1", optional = true }

[dev-dependencies]
cutweave-model = { path = "../cutweave-model", features = ["testing"] }
insta.workspace = true
proptest.workspace = true
serde_json.workspace = true

[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dev-dependencies]
png = "0.18.1"

[lints]
workspace = true
