[package]
name = "cutweave-cli"
description = "Cutweave: the cutweave command-line binary"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[features]
# The FFmpeg media backend of the engines this binary runs in process (`cutweave mcp --headless`,
# one-shot `--headless` sessions): forwards cutweave-engine's `ffmpeg`. Off by default like the
# engine's own; without it those engines have no decoder and clips render as missing.
ffmpeg = ["cutweave-engine/ffmpeg"]

[lib]
name = "cutweave_cli"
path = "src/lib.rs"

[[bin]]
name = "cutweave"
path = "src/main.rs"

# WP-1K.01 dependencies (each is justified here; all are already in Cargo.lock except clap_derive).
[dependencies]
# The one binary's argument parser (ADR-0002, WP-1K.01). Derive API; `cli.md` is generated from it.
clap = { version = "4.6", features = ["derive"] }
cutweave-api = { path = "../cutweave-api" }
cutweave-commands = { path = "../cutweave-commands" }
cutweave-engine = { path = "../cutweave-engine" }
cutweave-model = { path = "../cutweave-model" }
serde_json = { workspace = true }
# Attach mode: a blocking client of the engine's `/rpc` WebSocket, on a private current-thread
# runtime. Same pins as cutweave-api (already locked; no TLS, loopback only).
tokio = { version = "=1.54.1", features = ["rt", "time", "net"] }
tokio-tungstenite = { version = "=0.29.0", default-features = false, features = ["connect"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["sink", "std"] }

[dev-dependencies]
insta = { workspace = true }
tempfile = "3.27.0"
# WP-1J.03 process-level tests of `cutweave mcp`: rmcp's client (the version cutweave-api pins)
# over the child's stdio pipes, and tokio's process support to spawn it. Both already locked.
rmcp = { version = "=3.11.0", default-features = false, features = ["client", "transport-async-rw", "transport-streamable-http-client-reqwest"] }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "process", "time", "io-util"] }
# WP-1O.03 conformance suite (`tests/mcp_conformance`): the reqwest feature above is rmcp's
# Streamable HTTP client (loopback only, no TLS; cutweave-api enables it for its own tests) that
# reaches a child engine's `/mcp`. `regex` evaluates the `pattern` keyword in the suite's small
# JSON Schema checker (no `jsonschema` crate: it would add a large tree). `regex` is already
# locked (tracing-subscriber, insta); only this dev-dependency edge is new.
regex = { version = "1.13.2", default-features = false, features = ["std"] }

[lints]
workspace = true
