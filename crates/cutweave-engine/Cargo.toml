[package]
name = "cutweave-engine"
description = "Cutweave: composition root wiring the engine together and session lifecycle"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

# Launch-protocol harness (WP-1I.04): `cutweave-engine-serve engine --port N ...` runs
# `launch::main`, which `cutweave engine` (WP-1K.01) wraps. The integration tests spawn it.
[[bin]]
name = "cutweave-engine-serve"
path = "src/bin/cutweave-engine-serve.rs"

[features]
# `cutweave_engine::determinism`: the double-run determinism harness (WP-1B.08). Tests only; panics on failure.
testing = []
# The FFmpeg media backend (`cutweave_media::FfmpegBackend`): the export pipeline's encoder in
# the full engine (WP-1I.05) and the WP-1E.03 export tests that check real MP4 output. Needs the
# FFmpeg bundle (docs/dev/ffmpeg.md); off by default like cutweave-media's own feature. The
# engine is the composition root, the one crate allowed to enable it (`cargo xtask check-deps`).
ffmpeg = ["cutweave-media/ffmpeg"]

[dependencies]
# The local server (WP-1I.01): `ApiServer`, credential classes, run-file, the handshake token
# rules and the exit-12 contract the engine root starts and reuses (WP-1I.04).
cutweave-api = { path = "../cutweave-api" }
# The export pipeline's offline mixdown and its `SourceFactory` seam (WP-1E.03), and the
# playback mixer and output (WP-1I.05): `device` is cpal output on Windows and macOS (the null
# output everywhere else and in headless engines).
cutweave-audio = { path = "../cutweave-audio", default-features = false, features = ["device"] }
# The full engine's caches (WP-1I.05): `cache.sqlite` (frame indexes), thumbnails and
# filmstrips, waveform pyramids and the RAM frame cache (WP-1D.02/1D.05/1D.06). Workspace crate.
cutweave-cache = { path = "../cutweave-cache" }
# Playback (WP-1I.05): the transport, render loop, `view.*` transport commands and the preview
# ring publisher (WP-1H.01/1H.02). Workspace crate.
cutweave-playback = { path = "../cutweave-playback", features = ["transport"] }
# The doc actor's `CommitSink` seam, `JournaledCommit` and the recovery hooks of `DocConfig`
# (WP-1C.02: the journal persists committed transactions before they are acknowledged).
cutweave-commands = { path = "../cutweave-commands" }
# The engine's `JobManager` behind the `job.*` commands and import analysis (WP-1D.07).
cutweave-jobs = { path = "../cutweave-jobs" }
# The export pipeline's decoders and encoder (`MediaBackend`, WP-1E.03); the trait half unless
# the `ffmpeg` feature is on.
cutweave-media = { path = "../cutweave-media" }
cutweave-model = { path = "../cutweave-model" }
cutweave-ops = { path = "../cutweave-ops" }
# The export pipeline renders through the same evaluation, render graph and `FrameBackend` as
# `render.frame` (WP-1E.03). `gpu`: the engine owns the device (WP-1I.05), so the full engine
# builds the wgpu compositor for preview, `render.frame` and export.
cutweave-render = { path = "../cutweave-render", default-features = false, features = ["gpu"] }
serde.workspace = true
serde_json.workspace = true
# `specta::Type` on the engine event payloads (TS `EventMap`, WP-1N.02); `usize` fields export as `number`.
specta.workspace = true
specta-typescript.workspace = true
# Identity of the saved document a journal segment builds on (already a workspace dependency).
sha2.workspace = true
thiserror.workspace = true
# The engine runtime shared by the API server and the job manager, and the event fan-out
# (`broadcast`). Pinned exactly like cutweave-api's and cutweave-jobs' (already in Cargo.lock).
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "sync", "time", "signal", "macros"] }
# Journal warnings (torn tails, stale segments, fsync failures).
tracing.workspace = true
# The engine's JSON log file (WP-1I.04): only the span registry, no formatter features, so no
# crate outside Cargo.lock is pulled in (already locked at this version through loom).
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["registry", "std"] }

[dev-dependencies]
# This crate with `testing` on, so its tests (and `cargo nextest run --workspace`) include the harness.
cutweave-engine = { path = ".", features = ["testing"] }
cutweave-model = { path = "../cutweave-model", features = ["testing"] }
# The WP-1E.03 export tests render on a headless wgpu device (`GpuFrameBackend`).
cutweave-render = { path = "../cutweave-render", features = ["gpu"] }
# Decodes `render.frame`'s PNG in the export tests (already locked through cutweave-render).
png = "0.18.1"
# The WP-1J.01 launch test calls `/mcp` on the engine process with rmcp's own Streamable HTTP
# client (the version cutweave-api pins; no crate outside Cargo.lock).
rmcp = { version = "=3.11.0", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }
criterion.workspace = true
proptest.workspace = true

[[bench]]
name = "journal"
harness = false

[[bench]]
name = "autosave"
harness = false

[lints]
workspace = true
