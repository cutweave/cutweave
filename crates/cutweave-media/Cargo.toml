[package]
name = "cutweave-media"
description = "Cutweave: MediaBackend trait and FFmpeg implementation (probe, index, decode, encode, mux, HW accel)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
# The FFmpeg-backed `FfmpegBackend` (ADR-0003). Needs the pinned FFmpeg 8.1 shared bundle at build
# time (`FFMPEG_DIR`, libclang, a C compiler) and its libraries on the loader path at run time:
# see docs/dev/ffmpeg.md and `just test-ffmpeg`. Off by default so the workspace builds and tests
# without FFmpeg; the trait, the frame types and `FakeBackend` never need it.
ffmpeg = ["dep:ffmpeg-next"]
# Reserved for zero-copy hardware frames (ADR-0003 path (b): decoder surfaces shared with wgpu,
# e.g. D3D11 -> D3D12 shared handles), the later optimisation of WP-1D.04's CPU-upload path.
# A stub: enabling it changes nothing yet.
zero-copy = []

[dependencies]
# `ProbeInfo`, `ColorTags`, `Time` and `SampleRate`: the media layer speaks the model's types.
cutweave-model = { path = "../cutweave-model" }
thiserror.workspace = true
# Content hash and the frame-index blob checksum (pure Rust API, FFmpeg-free).
blake3.workspace = true
# Logs: FFmpeg's own log, the start-up banner and hardware-encoder choices (FFmpeg backend), and
# the software re-encode of `encode_with_fallback` (backend-agnostic, WP-1E.02).
tracing.workspace = true
# Only what the engine links (S3 finding F6): demux, decode/encode, swscale for the RGBA fallback
# path and swresample, which avcodec imports anyway. No avfilter/avdevice. The version is pinned
# exactly in the root manifest, because the start-up check ties the loaded libraries to the
# headers this release was built against.
ffmpeg-next = { workspace = true, optional = true, features = [
  "codec",
  "format",
  "software-scaling",
  "software-resampling",
] }

[dev-dependencies]
# Reads ffprobe -of json output in the corpus comparison tests (feature ).
serde_json.workspace = true

[lints]
workspace = true
