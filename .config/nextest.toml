# cargo-nextest configuration (https://nexte.st/docs/configuration/).

[profile.default]
# Report every failing test in a gate run instead of stopping at the first one.
fail-fast = false

# Timing-sensitive tests assert wall-clock budgets (cold start, cancellation latency, journal
# group commit, GPU render) or spawn the freshly built engine
# binary (the engine's launch tests; Windows Defender scans a new executable on first run). On a
# shared dev machine running parallel agent builds they occasionally miss; retry them. (The torn-frame and SHM stress tests wait for a count of frames, not for a
# time window, and the engine cold-start, export-cancel and media disconnect tests take the best of a few
# attempts inside the test: none of those needs a retry.) A real regression fails
# every attempt, and nextest reports retried tests as flaky. Budgets proper are enforced on the
# reference machines (docs/reference-machines.md).
[[profile.default.overrides]]
filter = 'test(/under_a_second|within_500_ms|within_timeout_plus_100_ms|syncs_within_the_window/) | (package(cutweave-render) & test(/^gpu::/)) | binary_id(cutweave-engine::launch)'
retries = 2
